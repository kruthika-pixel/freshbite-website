<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants - Foodie</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">Foodie</div>
        <a href="index.html" class="cart-button">Home</a>
         <a href="login.html" class="cart-button">Login</a>
        <a href="account.html" class="cart-button">My Account</a>
    </nav>
</header>

<main class="restaurant-page">
    <h1>Restaurants</h1>

    <div class="restaurant-filters">
        <select id="cuisineFilter">
            <option value="All">All Cuisines</option>
            <option value="Indian">Indian</option>
            <option value="Italian">Italian</option>
            <option value="Fast Food">Fast Food</option>
        </select>

        <select id="ratingFilter">
            <option value="0">All Ratings</option>
            <option value="4">4+ Rating</option>
            <option value="4.5">4.5+ Rating</option>
        </select>

               <select id="priceFilter">
            <option value="All">All Prices</option>
            <option value="300">Under ₹300</option>
            <option value="500">Under ₹500</option>
            <option value="1000">Under ₹1000</option>
        </select> 
    </div>

    <div id="restaurantContainer" class="restaurant-container"></div>
</main>

<script src="js/restaurants.js"></script>

</body>
</html>
